[project]
name = "litforge"
version = "0.1.0"
description = "Local-first scientific literature discovery, screening and analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]

[project.scripts]
litforge = "litforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litforge"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "docling.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
