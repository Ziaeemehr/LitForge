[project]
name = "litforge"
version = "0.5.0"
description = "Local-first scientific literature discovery, screening and analysis"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
embed = ["fastembed>=0.4"]
# "better math: medium": formula detection and LaTeX recognition on the CPU (no GPU needed).
# rapidocr 3.10 removed a function pix2text's dependency cnstd imports.
formulas = ["pix2text>=1.1.4", "rapidocr==3.9.0", "torch>=2.4", "torchvision>=0.19"]
# The same on an NVIDIA GPU (about 7x faster): CUDA 12.8 builds, which RTX 50-series cards need.
formulas-gpu = ["pix2text>=1.1.4", "rapidocr==3.9.0", "torch>=2.7", "torchvision>=0.22", "onnxruntime-gpu[cuda,cudnn]>=1.22"]
documents = [
    "markitdown[docx,pptx,xlsx]>=0.1.8",
]

[project.scripts]
litforge = "litforge.cli:app"

# Windows runs gui-scripts without a console window; the desktop shortcut starts this one.
[project.gui-scripts]
litforge-app = "litforge.cli:launch"

[tool.uv.sources]
# The CPU build of PyTorch is enough for Pix2Text and is a fraction of the size of the CUDA build.
torch = [{ index = "pytorch-cpu", extra = "formulas" }, { index = "pytorch-cu128", extra = "formulas-gpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "formulas" }, { index = "pytorch-cu128", extra = "formulas-gpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
conflicts = [[{ extra = "formulas" }, { extra = "formulas-gpu" }]]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litforge"]
artifacts = ["src/litforge/ui/static/**"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "docling.*", "pix2text.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
