criteria:
  question: Neural-network methods for simulation-based (likelihood-free) inference of simulator parameters
  include:
    - Proposes, implements or reviews a method for inferring parameters of simulators whose likelihood is intractable
  exclude:
    - General machine learning methods (architectures, optimizers, density estimators) that are not themselves applied to likelihood-free inference
screening:
  - {paper: "1911.01429", relevant: true}
  - {paper: "2007.09114", relevant: true}
  - {paper: "1905.07488", relevant: true}
  - {paper: "1805.07226", relevant: true}
  - {paper: "1605.06376", relevant: true}
  - {paper: "1705.07057", relevant: false, note: Borderline; a density estimator later used by SNL, but the paper itself does no likelihood-free inference.}
  - {paper: "1806.07366", relevant: false}
  - {paper: "1512.03385", relevant: false}
  - {paper: "1412.6980", relevant: false}
  - {paper: "1706.03762", relevant: false}

