matrix_question: How were these methods trained and released?
matrix_columns:
  - key: code_available
    label: Code available
    instruction: Does the paper state that code for the method or its experiments is publicly available?
    type: boolean
  - key: optimizer
    label: Training optimizer
    instruction: Which gradient optimizer does the paper use to train its own models? Not applicable when the paper trains no model.
    type: categorical
    options: [Adam, SGD, RMSProp, other]
  - key: inference_target
    label: Inference target
    instruction: For likelihood-free inference papers, what does the method learn from simulations? Not applicable to papers outside likelihood-free inference.
    type: categorical
    options: [posterior, likelihood, likelihood_ratio, several]
  - key: gpus_used
    label: GPUs used
    instruction: How many GPUs were used to train the main reported models?
    type: number
