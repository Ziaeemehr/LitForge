# LitForge default configuration. Override with LITFORGE_CONFIG=<path>.

parsing:
  fast_path: pymupdf
  complex_fallback: docling
  ocr: selective
  keep_originals: true
  # Figure crops are rendered at this resolution.
  figure_dpi: 150
  # Router thresholds: initial heuristics, to be calibrated on the benchmark set.
  router:
    min_chars_per_page: 200          # below this a page counts as text-sparse
    max_sparse_page_ratio: 0.5       # above this ratio of sparse pages -> needs_ocr
    max_replacement_char_ratio: 0.01 # U+FFFD or control chars -> needs_docling
    max_fragmented_line_ratio: 0.35  # very short lines suggest garbled order
    max_table_count: 6               # many tables -> needs_docling

indexing:
  chunk_target_tokens: 600
  chunk_overlap_tokens: 80
  index_references: false
  index_captions: true

discovery:
  sources: [openalex, crossref, arxiv]
  limit: 25            # results per source and query
  cache_ttl_days: 7    # API responses are cached under data/cache/http
  mailto: null         # optional contact e-mail sent to OpenAlex/Crossref ("polite pool")

similar:
  # Embedding model for meaning-based ranking (fastembed, ONNX). The default is small and runs on
  # a laptop CPU. On a GPU machine: embedding_model: BAAI/bge-large-en-v1.5, embedding_device: cuda
  # (install fastembed-gpu). Set embedding_model: null to rank by TF-IDF only.
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_device: cpu
  per_channel_limit: 50
  keyword_queries: 3

screening:
  # Local model (Ollama) that reads title + abstract and checks the project's criteria.
  # qwen3:4b is fast; qwen3:8b is slower but more careful. Pull with `ollama pull <model>`.
  model: qwen3:4b
  ollama_url: http://localhost:11434   # LITFORGE_OLLAMA_URL overrides
  default_top: 100                     # papers of a run screened when no count is given
  timeout_s: 120

privacy:
  allow_cloud: false
