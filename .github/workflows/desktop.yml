name: Desktop validation

on:
  push:
    branches: [feat/desktop-window]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full regression suite (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen --group dev
        id: install
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: node --test tests/ui/*.test.cjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: uv run --no-sync pytest --junitxml=desktop-results/pytest-full.xml -ra
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-quality-${{ github.run_attempt }}
          path: desktop-results/
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Native window (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-gtk-x64
            os: ubuntu-24.04
            gui: gtk
          - target: windows-webview2-x64
            os: windows-2022
            gui: edgechromium
          - target: macos-cocoa-arm64
            os: macos-15
            gui: cocoa
          - target: macos-cocoa-x64
            os: macos-15-intel
            gui: cocoa
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and desktop dependencies
        id: install
        run: uv sync --frozen --group dev --extra desktop
      - name: Install system GTK host and virtual display
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The Azure mirror stalled during the paper-link regression run. Use Ubuntu's archive on this VM.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth dbus-x11
          uv venv --python /usr/bin/python3 --system-site-packages .desktop-host-ci
          uv pip install --python .desktop-host-ci/bin/python pywebview==6.2.1
      - name: Desktop unit and server regression tests
        run: >-
          uv run --no-sync pytest tests/unit/test_desktop*.py tests/unit/test_shortcut.py
          tests/integration/test_desktop_server.py tests/integration/test_ui_server.py
          --junitxml=desktop-results/pytest-desktop.xml -ra
      - name: UI regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/ui/*.test.cjs
      - name: Real GTK window on virtual X11 display
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.install.outcome == 'success' }}
        run: >-
          xvfb-run -a dbus-run-session -- uv run --no-sync python scripts/desktop_smoke.py
          --gui gtk --host-python .desktop-host-ci/bin/python --output desktop-results
      - name: Real Cocoa or WebView2 window
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.install.outcome == 'success' }}
        run: uv run --no-sync python scripts/desktop_smoke.py --gui ${{ matrix.gui }} --output desktop-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}-${{ github.run_attempt }}
          path: desktop-results/
          if-no-files-found: warn
          retention-days: 14
